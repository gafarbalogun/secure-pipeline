[bandit]
# B101: Test for use of assert
# B102: Test for exec used
# B103: Test for setting permissive file permissions
# B104: Test for binding to all interfaces
# B105: Test for use of hard-coded password strings
# B106: Test for use of hard-coded password variables
# B107: Test for use of hard-coded password function arguments
# B108: Test for insecure usage of tmp file/directory
# B110: Try, Except, Pass detected
# B112: Try, Except, Continue detected
# B201: Test for use of flask_debug_true
# B301: Test for pickle usage
# B302: Test for use of marshal module
# B303: Test for use of md5 module
# B304: Test for use of insecure cipher mode
# B305: Test for use of insecure hash functions
# B306: Test for use of insecure FTP functions
# B307: Test for use of eval
# B308: Test for use of mark_safe
# B309: Test for use of httpsconnection with bad cert validation
# B310: Test for insecure URL fetching
# B311: Test for use of random module
# B312: Test for use of telnetlib module
# B313: Test for use of urllib modules with no SSL
# B314: Test for use of xml.etree.cElementTree.fromstring
# B315: Test for use of xml.sax.make_parser with no custom DTD handler
# B316: Test for use of xml.expat.ExpatBuilder with no custom DTD handler
# B317: Test for use of xml.expat.ExpatParser with no custom DTD handler
# B318: Test for use of xml.dom.expatbuilder.parseString with no custom DTD handler
# B319: Test for use of xml.dom.expatbuilder.parse with no custom DTD handler
# B320: Test for use of xml.dom.minidom.parseString with no custom DTD handler
# B321: Test for use of xml.dom.minidom.parse with no custom DTD handler
# B322: Test for use of defused packages
# B323: Test for use of unverified context in ssl

# High severity issues
skips = 

# Tests to run
tests = B101,B102,B103,B104,B105,B106,B107,B108,B110,B112,B201,B301,B302,B303,B304,B305,B306,B307,B308,B309,B310,B311,B312,B313,B314,B315,B316,B317,B318,B319,B320,B321,B322,B323

# Files/directories to exclude
exclude_dirs = /venv/,/tests/,/test/

[tool:bandit]
# Set the level to a medium threshold
targets = app/
exclude = /venv/,/tests/,/test/

# Severity levels for specific checks
[bandit.low_severity]
confidence_level = LOW
severity_level = LOW

[bandit.medium_severity]
confidence_level = MEDIUM
severity_level = MEDIUM

[bandit.high_severity]
confidence_level = HIGH
severity_level = HIGH

